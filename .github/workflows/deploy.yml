name: Deploy edge function

# Deploys the `mp` edge function to Supabase whenever its source changes on main.
# One-time setup: add a repo secret SUPABASE_ACCESS_TOKEN
# (Supabase dashboard → Account → Access Tokens). The project ref is public.
# Front-end (GitHub Pages) deploys separately; this only touches the backend.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy-mp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. On 2026-08-02 this step failed with no change
          # on our side and blocked the deploy — a floating version means an
          # upstream release can break the pipeline at any time, and the failure
          # looks like your own commit broke it. Bump deliberately.
          version: 2.111.0
      - name: Deploy mp
        run: supabase functions deploy mp --project-ref ubadgdkajflkmmbmgeov
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
