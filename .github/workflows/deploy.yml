name: Deploy edge function

# Deploys the `mp` edge function to Supabase whenever its source changes on main.
# One-time setup: add a repo secret SUPABASE_ACCESS_TOKEN
# (Supabase dashboard → Account → Access Tokens). The project ref is public.
# Front-end (GitHub Pages) deploys separately; this only touches the backend.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy-mp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy mp
        run: supabase functions deploy mp --project-ref ubadgdkajflkmmbmgeov
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
